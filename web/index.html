<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiePos — Transaksi Berhasil</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1565C0 0%, #0D47A1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: #E8F5E9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .icon-wrapper svg {
      width: 44px;
      height: 44px;
      fill: #2E7D32;
    }

    .brand {
      font-size: 14px;
      color: #1565C0;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 24px;
      color: #212121;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #757575;
      margin-bottom: 32px;
    }

    .total-box {
      background: #F5F7FA;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .total-label {
      font-size: 13px;
      color: #757575;
      margin-bottom: 4px;
    }

    .total-amount {
      font-size: 36px;
      font-weight: 800;
      color: #1565C0;
      letter-spacing: -1px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }

    .meta-item {
      background: #F5F7FA;
      border-radius: 12px;
      padding: 12px;
    }

    .meta-item .label {
      font-size: 11px;
      color: #757575;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .meta-item .value {
      font-size: 14px;
      font-weight: 600;
      color: #212121;
    }

    .method-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #E3F2FD;
      color: #1565C0;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 32px;
    }

    .divider {
      height: 1px;
      background: #E0E0E0;
      margin-bottom: 24px;
    }

    .footer {
      font-size: 12px;
      color: #BDBDBD;
    }

    .footer strong {
      color: #1565C0;
    }

    .timestamp {
      font-size: 13px;
      color: #9E9E9E;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <!-- Checkmark icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
    </div>

    <div class="brand">MiePos</div>
    <h1>Transaksi Berhasil!</h1>
    <p class="subtitle" id="subtitle">Pembayaran telah dikonfirmasi</p>

    <div class="total-box">
      <div class="total-label">Total Pembayaran</div>
      <div class="total-amount" id="totalAmount">Rp 0</div>
    </div>

    <div class="meta-grid">
      <div class="meta-item">
        <div class="label">Tanggal</div>
        <div class="value" id="metaDate">—</div>
      </div>
      <div class="meta-item">
        <div class="label">Waktu</div>
        <div class="value" id="metaTime">—</div>
      </div>
      <div class="meta-item">
        <div class="label">ID Transaksi</div>
        <div class="value" id="metaTxId">—</div>
      </div>
      <div class="meta-item">
        <div class="label">Kasir</div>
        <div class="value" id="metaKasir">—</div>
      </div>
    </div>

    <div class="method-badge">
      <span id="methodIcon">💳</span>
      <span id="methodLabel">QRIS</span>
    </div>

    <div class="divider"></div>

    <div class="footer">
      Terima kasih telah berbelanja di<br>
      <strong>Warung Mie Ayam MiePos</strong>
    </div>

    <div class="timestamp" id="timestampFull"></div>
  </div>

  <script>
    function formatRupiah(n) {
      return 'Rp ' + Number(n).toLocaleString('id-ID');
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    const params = new URLSearchParams(window.location.search);

    // Total
    const total = params.get('total') || '0';
    document.getElementById('totalAmount').textContent = formatRupiah(total);

    // Payment method
    const method = (params.get('method') || 'qris').toLowerCase();
    const methodMap = {
      cash:  { icon: '💵', label: 'Cash' },
      qris:  { icon: '📱', label: 'QRIS' },
      debit: { icon: '💳', label: 'Kartu Debit' },
    };
    const m = methodMap[method] || methodMap.qris;
    document.getElementById('methodIcon').textContent = m.icon;
    document.getElementById('methodLabel').textContent = m.label;

    // Kasir
    const kasir = params.get('kasir') || 'Kasir';
    document.getElementById('metaKasir').textContent = kasir;

    // TX ID
    const txId = params.get('txid') || ('#' + Math.random().toString(36).substr(2,6).toUpperCase());
    document.getElementById('metaTxId').textContent = txId;

    // Date/time
    const now = new Date();
    const days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
    const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    document.getElementById('metaDate').textContent =
      `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
    document.getElementById('metaTime').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    document.getElementById('timestampFull').textContent =
      `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} · ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

    // Subtitle
    document.getElementById('subtitle').textContent =
      `Pembayaran ${m.label} telah dikonfirmasi`;
  </script>
</body>
</html>
